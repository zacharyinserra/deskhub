[project]
name = "deskhub"
version = "0.1.0"
description = "PC companion for the ESP32-S3 desk hub: stats, media, calendar and shortcuts."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "psutil>=6",
    "nvidia-ml-py>=12",
    "pillow>=10",
    "httpx>=0.27",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "caldav>=1.4",
    "keyring>=25",
    "tomlkit>=0.13",
    "tzdata>=2024.1",
    "pyserial>=3.5",
    "paho-mqtt>=2",
    "pynput>=1.7",
    "winrt-runtime>=2.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.2; sys_platform == 'win32'",
]

[project.scripts]
deskhub = "deskhub.__main__:main"
deskhub-calendars = "deskhub.calendars_cli:main"
deskhub-setup = "deskhub.setup_cli:main"
deskhub-printers = "deskhub.printers_cli:main"
deskhub-games = "deskhub.games_cli:main"
deskhub-install = "deskhub.install_startup:main"
deskhub-flash = "deskhub.flash_cli:main"
deskhub-config = "deskhub.configurator:main"

[dependency-groups]
dev = [
    "radicale>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
